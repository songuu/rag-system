# Install as /etc/systemd/system/ollama.service.d/capacity.conf on the
# inference host, not in the Next.js / PM2 environment. See the runbook.
[Service]
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_MAX_QUEUE=16"
# A replacement daemon must not coexist with orphaned model runners.
KillMode=control-group
