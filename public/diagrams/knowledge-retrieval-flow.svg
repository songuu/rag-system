<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1020" viewBox="0 0 1680 1020" role="img" aria-labelledby="title desc">
  <title>当前知识库检索流程图</title>
  <desc>展示从用户问题、安全范围校验、检索路由、问题向量化、Milvus 检索、证据归一化、阈值拒答判断、上下文编排到模型回答的完整流程，以及 Hybrid、顺序全文、图谱和 PDF 视觉增强检索通道。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f6f3ff"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 30px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.subtitle{font:400 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.section{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#1e293b}.node-title{font:700 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.node-text{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}.tiny{font:400 11px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.badge{font:700 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#fff}.lane-title{font:700 15px "Microsoft YaHei","PingFang SC",sans-serif}.lane-text{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}.summary{font:600 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1680" height="1020" rx="24" fill="url(#page)"/><rect width="1680" height="10" rx="5" fill="url(#header)"/>
  <text x="42" y="56" class="title">当前知识库检索逻辑</text>
  <text x="42" y="86" class="subtitle">核心路径以 Milvus Dense 检索为默认；路由器会依据问题类型与运行时能力选择或追加增强通道。</text>
  <g transform="translate(1332 35)"><rect width="306" height="54" rx="14" fill="#fff" stroke="#dbeafe"/><circle cx="27" cy="27" r="9" fill="#22c55e"/><text x="47" y="23" class="tiny">当前向量库</text><text x="47" y="42" class="node-title">default / rag_documents</text></g>
  <text x="42" y="132" class="section">主检索链路</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M215 281H235"/><path d="M420 281H440"/><path d="M625 281H645"/><path d="M830 281H850"/><path d="M1035 281H1055"/><path d="M1240 281H1260"/><path d="M1445 281H1465"/></g>
  <g filter="url(#shadow)">
    <g transform="translate(30 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#eff6ff"/><circle cx="24" cy="26" r="14" fill="#2563eb"/><text x="20" y="31" class="badge">1</text><text x="47" y="31" class="node-title">安全范围校验</text><text x="18" y="82" class="node-text"><tspan x="18">从认证上下文生成</tspan><tspan x="18" dy="20">tenantId / corpusId</tspan></text><rect x="17" y="127" width="151" height="54" rx="10" fill="#f8fafc" stroke="#dbeafe"/><text x="30" y="150" class="tiny">✓ 服务端可信身份</text><text x="30" y="169" class="tiny">✓ 语料库隔离过滤</text><text x="18" y="215" class="tiny"><tspan x="18">拒绝客户端伪造</tspan><tspan x="18" dy="17">检索范围</tspan></text></g>
    <g transform="translate(235 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#eef2ff"/><circle cx="24" cy="26" r="14" fill="#4f46e5"/><text x="20" y="31" class="badge">2</text><text x="47" y="31" class="node-title">检索路由</text><text x="18" y="82" class="node-text"><tspan x="18">识别问题类型并探测</tspan><tspan x="18" dy="20">可用检索能力</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#f8fafc" stroke="#c7d2fe"/><text x="30" y="149" class="tiny">语义 · 精确标识</text><text x="30" y="168" class="tiny">全局总结 · 图表视觉</text><text x="30" y="187" class="tiny">策略与运行时能力</text><text x="18" y="228" class="tiny">生成 Retrieval Plan</text></g>
    <g transform="translate(440 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#86efac" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#f0fdf4"/><circle cx="24" cy="26" r="14" fill="#16a34a"/><text x="20" y="31" class="badge">3</text><text x="47" y="31" class="node-title">问题向量化</text><text x="18" y="82" class="node-text"><tspan x="18">使用已选 Embedding</tspan><tspan x="18" dy="20">模型编码用户问题</tspan></text><rect x="17" y="127" width="151" height="54" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="30" y="150" class="tiny">问题 → [0.18, …]</text><text x="30" y="169" class="tiny">维度必须与库一致</text><text x="18" y="215" class="tiny"><tspan x="18">同一请求只计算一次</tspan><tspan x="18" dy="17">并记录耗时</tspan></text></g>
    <g transform="translate(645 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#67e8f9" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#ecfeff"/><circle cx="24" cy="26" r="14" fill="#0891b2"/><text x="20" y="31" class="badge">4</text><text x="47" y="31" class="node-title">Milvus Dense 检索</text><text x="18" y="82" class="node-text"><tspan x="18">连接并初始化集合</tspan><tspan x="18" dy="20">执行向量相似度搜索</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#ecfeff" stroke="#a5f3fc"/><text x="30" y="149" class="tiny">Top-K + 相似度阈值</text><text x="30" y="168" class="tiny">tenant / corpus Filter</text><text x="30" y="187" class="tiny">超时与数量预算</text><text x="18" y="228" class="tiny">默认核心检索通道</text></g>
    <g transform="translate(850 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#f5f3ff"/><circle cx="24" cy="26" r="14" fill="#7c3aed"/><text x="20" y="31" class="badge">5</text><text x="47" y="31" class="node-title">证据归一化</text><text x="18" y="82" class="node-text"><tspan x="18">将各通道结果转换为</tspan><tspan x="18" dy="20">统一 Evidence 结构</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text x="30" y="149" class="tiny">内容 · 来源 · 文档版本</text><text x="30" y="168" class="tiny">检索分数 · 通道 ID</text><text x="30" y="187" class="tiny">合并多通道结果</text><text x="18" y="228" class="tiny">保留可追溯证据身份</text></g>
    <g transform="translate(1055 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#fff1f2"/><circle cx="24" cy="26" r="14" fill="#e11d48"/><text x="20" y="31" class="badge">6</text><text x="47" y="31" class="node-title">阈值与拒答判断</text><text x="18" y="82" class="node-text"><tspan x="18">校准不同通道分数</tspan><tspan x="18" dy="20">检查证据覆盖度</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#fff1f2" stroke="#fecdd3"/><text x="30" y="149" class="tiny">最低分数</text><text x="30" y="168" class="tiny">最少不同文档数</text><text x="30" y="187" class="tiny">无证据时禁止猜测</text><text x="18" y="228" class="tiny">Active 模式直接拒答</text></g>
    <g transform="translate(1260 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#fdba74" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#fff7ed"/><circle cx="24" cy="26" r="14" fill="#ea580c"/><text x="20" y="31" class="badge">7</text><text x="47" y="31" class="node-title">上下文编排</text><text x="18" y="82" class="node-text"><tspan x="18">按检索或文档顺序</tspan><tspan x="18" dy="20">组合可信证据</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#fff7ed" stroke="#fed7aa"/><text x="30" y="149" class="tiny">默认 4,000 Token</text><text x="30" y="168" class="tiny">超额证据安全截断</text><text x="30" y="187" class="tiny">生成 Context Digest</text><text x="18" y="228" class="tiny">记录纳入/排除证据</text></g>
    <g transform="translate(1465 155)"><rect width="185" height="252" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><path d="M16 0h153a16 16 0 0116 16v36H0V16A16 16 0 0116 0" fill="#eff6ff"/><circle cx="24" cy="26" r="14" fill="#2563eb"/><text x="20" y="31" class="badge">8</text><text x="47" y="31" class="node-title">模型生成回答</text><text x="18" y="82" class="node-text"><tspan x="18">仅基于编排后的上下文</tspan><tspan x="18" dy="20">调用所选 LLM</tspan></text><rect x="17" y="127" width="151" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="30" y="149" class="tiny">返回答案与证据</text><text x="30" y="168" class="tiny">检索详情与耗时</text><text x="30" y="187" class="tiny">Trace ID / 执行轨迹</text><text x="18" y="228" class="tiny">无上下文则明确无法回答</text></g>
  </g>
  <text x="42" y="462" class="section">增强检索通道</text><text x="210" y="462" class="subtitle">由检索路由按需选择；功能未开启或能力不可用时不会进入执行计划</text>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#arrowSoft)">
    <path d="M328 408V474H240V487"/><path d="M328 474H640V487"/><path d="M328 474H1040V487"/><path d="M328 474H1440V487"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(55 492)"><rect width="370" height="132" rx="16" fill="#fff" stroke="#67e8f9"/><rect width="9" height="132" rx="4.5" fill="#06b6d4"/><circle cx="49" cy="43" r="22" fill="#cffafe"/><text x="40" y="50" font-size="22">⚡</text><text x="84" y="37" class="lane-title" fill="#0e7490">Hybrid 混合检索</text><text x="84" y="59" class="lane-text">Dense Vector + Milvus BM25 稀疏检索</text><text x="28" y="94" class="tiny">触发：精确标识类问题 + Hybrid 能力探测通过</text><text x="28" y="115" class="tiny">收益：兼顾语义相似与关键词精确命中</text></g>
    <g transform="translate(455 492)"><rect width="370" height="132" rx="16" fill="#fff" stroke="#c4b5fd"/><rect width="9" height="132" rx="4.5" fill="#8b5cf6"/><circle cx="49" cy="43" r="22" fill="#ede9fe"/><text x="39" y="50" font-size="22">↕</text><text x="84" y="37" class="lane-title" fill="#6d28d9">顺序全文读取</text><text x="84" y="59" class="lane-text">按文档与块顺序读取有界语料内容</text><text x="28" y="94" class="tiny">触发：全局总结类问题 + Ordered Context 已启用</text><text x="28" y="115" class="tiny">收益：避免 Top-K 丢失跨章节的整体脉络</text></g>
    <g transform="translate(855 492)"><rect width="370" height="132" rx="16" fill="#fff" stroke="#f0abfc"/><rect width="9" height="132" rx="4.5" fill="#c026d3"/><circle cx="49" cy="43" r="22" fill="#fae8ff"/><text x="39" y="50" font-size="22">◎</text><text x="84" y="37" class="lane-title" fill="#a21caf">图谱实体检索</text><text x="84" y="59" class="lane-text">按实体关系与有限跳数获取图谱证据</text><text x="28" y="94" class="tiny">触发：MiroFish Research + 存在图谱制品</text><text x="28" y="115" class="tiny">收益：补充跨文档实体关联与关系上下文</text></g>
    <g transform="translate(1255 492)"><rect width="370" height="132" rx="16" fill="#fff" stroke="#fdba74"/><rect width="9" height="132" rx="4.5" fill="#f97316"/><circle cx="49" cy="43" r="22" fill="#ffedd5"/><text x="38" y="50" font-size="22">▧</text><text x="84" y="37" class="lane-title" fill="#c2410c">PDF 视觉检索</text><text x="84" y="59" class="lane-text">从页面图像中提取图表、表格等视觉证据</text><text x="28" y="94" class="tiny">触发：视觉意图 + 多模态模式及模型可用</text><text x="28" y="115" class="tiny">收益：覆盖纯文本解析无法表达的页面信息</text></g>
  </g>
  <text x="42" y="682" class="section">关键保障</text>
  <g filter="url(#shadow)">
    <g transform="translate(55 706)"><rect width="370" height="112" rx="15" fill="#fff" stroke="#bfdbfe"/><circle cx="44" cy="42" r="23" fill="#dbeafe"/><text x="35" y="50" font-size="22">✓</text><text x="80" y="37" class="node-title">检索隔离</text><text x="80" y="60" class="node-text">每次 Milvus 查询都携带服务端范围 Filter</text><text x="26" y="92" class="tiny">租户、语料库与可信级别不匹配的证据不会进入上下文</text></g>
    <g transform="translate(455 706)"><rect width="370" height="112" rx="15" fill="#fff" stroke="#bbf7d0"/><circle cx="44" cy="42" r="23" fill="#dcfce7"/><text x="33" y="50" font-size="21">D</text><text x="80" y="37" class="node-title">向量维度一致</text><text x="80" y="60" class="node-text">查询模型维度必须匹配 Collection Schema</text><text x="26" y="92" class="tiny">维度不一致时显式失败，避免错误检索和隐式数据污染</text></g>
    <g transform="translate(855 706)"><rect width="370" height="112" rx="15" fill="#fff" stroke="#fed7aa"/><circle cx="44" cy="42" r="23" fill="#ffedd5"/><text x="35" y="50" font-size="21">#</text><text x="80" y="37" class="node-title">预算控制</text><text x="80" y="60" class="node-text">限制通道数、证据数、检索时间和 Token</text><text x="26" y="92" class="tiny">避免无限检索与上下文膨胀，超时会携带明确阶段信息</text></g>
    <g transform="translate(1255 706)"><rect width="370" height="112" rx="15" fill="#fff" stroke="#fecdd3"/><circle cx="44" cy="42" r="23" fill="#ffe4e6"/><text x="36" y="50" font-size="22">!</text><text x="80" y="37" class="node-title">可信拒答</text><text x="80" y="60" class="node-text">无上下文或证据不足时不生成推测性答案</text><text x="26" y="92" class="tiny">回答同时返回证据、检索详情、耗时与 Trace ID</text></g>
  </g>
  <g transform="translate(55 852)"><rect width="1570" height="112" rx="18" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="24" y="30" class="node-title">默认路径示例</text><g transform="translate(25 49)"><rect width="210" height="42" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="55" y="27" class="summary">用户问题</text><path d="M220 21H270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" width="265" height="42" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="326" y="27" class="summary">同维度问题向量</text><path d="M555 21H605" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="615" width="305" height="42" rx="10" fill="#ecfeff" stroke="#67e8f9"/><text x="661" y="27" class="summary">Milvus Top-K + 范围过滤</text><path d="M930 21H980" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="990" width="250" height="42" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="1031" y="27" class="summary">可信证据上下文</text><path d="M1250 21H1300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1310" width="210" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1365" y="27" class="summary">依据回答</text></g></g>
  <text x="840" y="996" text-anchor="middle" class="tiny">图示依据当前 /api/ask Milvus 检索管线生成 · 增强通道是否启用以运行时配置和能力探测为准</text>
</svg>
