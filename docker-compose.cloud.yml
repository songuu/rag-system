services:
  app:
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      MILVUS_PROVIDER: ${MILVUS_PROVIDER:-zilliz}
      RAG_PERSISTENCE_BACKEND: ${RAG_PERSISTENCE_BACKEND:-postgres}
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-zilliz}
      # Inject the DSN from the cloud secret manager. Do not bake it into the image.
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL must be injected as a runtime secret}
      DATABASE_URL: ""
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-verify-full}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-10}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      RAG_DEFAULT_TENANT_ID: ${RAG_DEFAULT_TENANT_ID:?RAG_DEFAULT_TENANT_ID is required}
      RAG_DEFAULT_CORPUS_ID: ${RAG_DEFAULT_CORPUS_ID:?RAG_DEFAULT_CORPUS_ID is required}
      RAG_ACCESS_MODE: ${RAG_ACCESS_MODE:-single-tenant-token}
      RAG_SINGLE_TENANT_TOKEN: ${RAG_SINGLE_TENANT_TOKEN:?RAG_SINGLE_TENANT_TOKEN must be injected as a runtime secret}
      RAG_TENANT_ISOLATION_REQUIRED: ${RAG_TENANT_ISOLATION_REQUIRED:-true}
      # Missing Neo4j secrets must not implicitly enable the graph backend.
      RAG_GRAPH_BACKEND: ${RAG_GRAPH_BACKEND:-file}
      RAG_GRAPH_MODE: ${RAG_GRAPH_MODE:-off}
      RAG_GRAPH_AUTO_BUILD: ${RAG_GRAPH_AUTO_BUILD:-true}
      RAG_GRAPH_WRITE_TIMEOUT_MS: ${RAG_GRAPH_WRITE_TIMEOUT_MS:-120000}
      RAG_KG_QUERY_MAX_CONCURRENCY: ${RAG_KG_QUERY_MAX_CONCURRENCY:-8}
      RAG_KG_QUERY_RATE_PER_MINUTE: ${RAG_KG_QUERY_RATE_PER_MINUTE:-120}
      RAG_KG_BUILD_RATE_PER_MINUTE: ${RAG_KG_BUILD_RATE_PER_MINUTE:-20}
      RAG_KG_BUILD_MAX_PENDING_PER_SCOPE: ${RAG_KG_BUILD_MAX_PENDING_PER_SCOPE:-20}
      RAG_NEO4J_REQUIRE_TLS: "true"
      NEO4J_ALLOW_INSECURE: ${NEO4J_ALLOW_INSECURE:-false}
      # Cloud deployments connect to an externally managed Neo4j instance.
      # Inject credentials from the runtime secret manager; no password default
      # is provided and this Compose file never starts or publishes Neo4j.
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      RAG_ELASTICSEARCH_MODE: ${RAG_ELASTICSEARCH_MODE:-off}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-rag_chunks_v1}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_CA_FINGERPRINT: ${ELASTICSEARCH_CA_FINGERPRINT:-}
      ELASTICSEARCH_ALLOW_INSECURE: "false"
      ELASTICSEARCH_ALLOW_UNAUTHENTICATED: "false"

  graph-control-worker:
    profiles: ["graph-control"]
    environment:
      RAG_PERSISTENCE_BACKEND: ${RAG_PERSISTENCE_BACKEND:-postgres}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL must be injected as a runtime secret}
      DATABASE_URL: ""
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-verify-full}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-10}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      RAG_GRAPH_BACKEND: ${RAG_GRAPH_BACKEND:-file}
      RAG_GRAPH_WRITE_TIMEOUT_MS: ${RAG_GRAPH_WRITE_TIMEOUT_MS:-120000}
      RAG_NEO4J_REQUIRE_TLS: "true"
      NEO4J_ALLOW_INSECURE: ${NEO4J_ALLOW_INSECURE:-false}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      RAG_GRAPH_PUBLICATION_WEBHOOK_URL: ${RAG_GRAPH_PUBLICATION_WEBHOOK_URL:-}
      RAG_GRAPH_BUILD_WEBHOOK_URL: ${RAG_GRAPH_BUILD_WEBHOOK_URL:-}
      RAG_GRAPH_WEBHOOK_SECRET: ${RAG_GRAPH_WEBHOOK_SECRET:-}
      RAG_GRAPH_BUILD_WEBHOOK_TIMEOUT_MS: ${RAG_GRAPH_BUILD_WEBHOOK_TIMEOUT_MS:-120000}

  search-index-worker:
    profiles: ["search-index"]
    environment:
      RAG_PERSISTENCE_BACKEND: ${RAG_PERSISTENCE_BACKEND:-postgres}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL must be injected as a runtime secret}
      DATABASE_URL: ""
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-verify-full}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-10}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      RAG_DEFAULT_TENANT_ID: ${RAG_DEFAULT_TENANT_ID:?RAG_DEFAULT_TENANT_ID is required}
      RAG_DEFAULT_CORPUS_ID: ${RAG_DEFAULT_CORPUS_ID:?RAG_DEFAULT_CORPUS_ID is required}
      RAG_ELASTICSEARCH_MODE: ${RAG_ELASTICSEARCH_MODE:?RAG_ELASTICSEARCH_MODE must be shadow or active}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?ELASTICSEARCH_URL is required}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-rag_chunks_v1}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_CA_FINGERPRINT: ${ELASTICSEARCH_CA_FINGERPRINT:-}
      ELASTICSEARCH_ALLOW_INSECURE: "false"
      ELASTICSEARCH_ALLOW_UNAUTHENTICATED: "false"
