name: Deploy RAG System to songuu.top

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: rag-system-production
  cancel-in-progress: false

permissions:
  contents: read

# Server deployment: build a Linux standalone artifact, atomically switch the
# host release symlink, then verify the isolated /rag-system gateway path.
# Required secret: RAG_SYSTEM_SSH_PRIVATE_KEY. A non-default DEPLOY_HOST also
# requires RAG_SYSTEM_SSH_KNOWN_HOSTS; the default host key is pinned in-repo.
# Optional secrets: RAG_SYSTEM_DEPLOY_HOST, RAG_SYSTEM_DEPLOY_USER,
# RAG_SYSTEM_DOMAIN. Runtime model/vector credentials remain only on the host.
jobs:
  build-and-deploy:
    name: Build and deploy (server application)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "11.1.3"
      DEPLOY_HOST: ${{ secrets.RAG_SYSTEM_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.RAG_SYSTEM_DEPLOY_USER }}
      DOMAIN: ${{ secrets.RAG_SYSTEM_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set deployment defaults
        run: |
          set -euo pipefail
          {
            echo "DEPLOY_HOST=${DEPLOY_HOST:-47.253.230.197}"
            echo "DEPLOY_USER=${DEPLOY_USER:-root}"
            echo "DOMAIN=${DOMAIN:-songuu.top}"
            echo "BASE_PATH=/rag-system"
            echo "RELEASE_ROOT=/opt/rag-system/releases"
            echo "CURRENT_LINK=/opt/rag-system/current"
            echo "REMOTE_PARENT=/opt/rag-system/staging"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RAG_SYSTEM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing required GitHub secret RAG_SYSTEM_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RAG quality gates
        run: |
          set -euo pipefail
          pnpm test
          pnpm exec tsc --noEmit --incremental false

      - name: Build Linux production image
        run: |
          set -euo pipefail
          unset STATIC_EXPORT
          image="rag-system:${GITHUB_SHA}"
          docker build --progress=plain \
            --build-arg RAG_BASE_PATH="${BASE_PATH}" \
            --tag "${image}" \
            .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Package standalone release
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.tgz"
          entries="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.entries"
          docker run --rm --entrypoint sh "${IMAGE}" \
            -c 'tar -C /app --owner=0 --group=0 --numeric-owner -czf - server.js .next public node_modules db/postgres scripts/migrate-postgres.mjs scripts/backfill-local-postgres.mjs' > "${archive}"
          tar -tzf "${archive}" > "${entries}"
          grep -qx 'server.js' "${entries}"
          grep -q '^\.next/static/' "${entries}"
          grep -q '^node_modules/\.pnpm/onnxruntime-node@1\.14\.0/' "${entries}"
          grep -qx 'db/postgres/bootstrap.sql' "${entries}"
          grep -Eq '^db/postgres/migrations/.+\.sql$' "${entries}"
          grep -qx 'scripts/migrate-postgres.mjs' "${entries}"
          grep -qx 'scripts/backfill-local-postgres.mjs' "${entries}"
          tar --numeric-owner -tvzf "${archive}" | awk '$2 != "0/0" { exit 1 }'
          sha256sum "${archive}"
          {
            echo "ARCHIVE=${archive}"
            echo "RELEASE_NAME=rag-system-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RAG_SYSTEM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RAG_SYSTEM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/rag_system_deploy_key
          chmod 600 ~/.ssh/rag_system_deploy_key
          if [ "${DEPLOY_HOST}" = '47.253.230.197' ]; then
            if [ -n "${SSH_KNOWN_HOSTS}" ]; then
              echo 'RAG_SYSTEM_SSH_KNOWN_HOSTS is only accepted for a non-default DEPLOY_HOST.' >&2
              exit 2
            fi
            install -m 600 deploy/songuu/ssh-known-hosts ~/.ssh/known_hosts
          else
            if [ -z "${SSH_KNOWN_HOSTS}" ]; then
              echo '::error::Missing required GitHub secret RAG_SYSTEM_SSH_KNOWN_HOSTS for non-default DEPLOY_HOST'
              exit 1
            fi
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          if ! ssh-keygen -F "${DEPLOY_HOST}" -f ~/.ssh/known_hosts >/dev/null; then
            echo '::error::Pinned known_hosts does not contain DEPLOY_HOST'
            exit 1
          fi

      - name: Create secure remote staging
        run: |
          set -euo pipefail
          remote_dir="$(
            ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "REMOTE_PARENT='${REMOTE_PARENT}' bash -s" <<'REMOTE_STAGE'
          set -euo pipefail
          test "$(id -u)" = '0'
          remote_root="$(dirname -- "${REMOTE_PARENT}")"
          test "${remote_root}" = '/opt/rag-system'
          if [ -e "${remote_root}" ] || [ -L "${remote_root}" ]; then
            test -d "${remote_root}"
            test ! -L "${remote_root}"
          else
            install -d -o root -g root -m 0755 -- "${remote_root}"
          fi
          test "$(readlink -f -- "${remote_root}")" = "${remote_root}"
          test "$(stat -c '%U:%G' -- "${remote_root}")" = 'root:root'
          test "$(stat -c '%a' -- "${remote_root}")" = '755'
          if [ -e "${REMOTE_PARENT}" ] || [ -L "${REMOTE_PARENT}" ]; then
            test -d "${REMOTE_PARENT}"
            test ! -L "${REMOTE_PARENT}"
          else
            install -d -o root -g root -m 0755 -- "${REMOTE_PARENT}"
          fi
          test "$(readlink -f -- "${REMOTE_PARENT}")" = "${REMOTE_PARENT}"
          test "$(stat -c '%U:%G' -- "${REMOTE_PARENT}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_PARENT}")" = '755'
          umask 077
          remote_dir="$(mktemp -d "${REMOTE_PARENT}/rag-system.XXXXXXXXXX")"
          test -d "${remote_dir}"
          test ! -L "${remote_dir}"
          test "$(stat -c '%U:%G' -- "${remote_dir}")" = 'root:root'
          test "$(stat -c '%a' -- "${remote_dir}")" = '700'
          printf '%s\n' "${remote_dir}"
          REMOTE_STAGE
          )"
          case "${remote_dir}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) echo 'Remote staging returned an unsafe path.' >&2; exit 2 ;;
          esac
          archive_name="$(basename -- "${ARCHIVE}")"
          {
            printf 'REMOTE_DIR=%s\n' "${remote_dir}"
            printf 'REMOTE_ARCHIVE=%s/%s\n' "${remote_dir}" "${archive_name}"
          } >> "$GITHUB_ENV"

      - name: Upload release and host scripts
        run: |
          set -euo pipefail
          payloads=(
            "${ARCHIVE}"
            deploy/songuu/run-rag-system.sh
            deploy/songuu/run-rag-system.cjs
            deploy/songuu/rag-system.ecosystem.config.cjs
            deploy/songuu/manage-rag-system-pm2.sh
            deploy/songuu/release-host.sh
            deploy/songuu/post-release-gate.sh
            deploy/songuu/provision-postgres-host.sh
            deploy/songuu/render-host-env-defaults.py
            deploy/songuu/reload-rag-system-env.sh
            deploy/songuu/refresh-rag-nginx-token.sh
            deploy/songuu/rag-system-env-reload.service
            deploy/songuu/rag-system-env-reload.path
            deploy/songuu/patch-nginx.py
            deploy/songuu/apply-nginx.sh
            .env.container.example
          )
          checksums="${RUNNER_TEMP}/rag-system-sha256sums.txt"
          : > "${checksums}"
          for source in "${payloads[@]}"; do
            test -f "${source}"
            digest="$(sha256sum "${source}" | cut -d' ' -f1)"
            printf '%s  %s\n' "${digest}" "$(basename -- "${source}")" >> "${checksums}"
          done
          chmod 600 "${checksums}"

          upload_complete=0
          cleanup_failed_upload() {
            status=$?
            trap - EXIT
            if [ "${upload_complete}" != '1' ]; then
              ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE_CLEANUP' || true
          set -euo pipefail
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          rm -rf -- "${REMOTE_DIR}"
          REMOTE_CLEANUP
            fi
            exit "${status}"
          }
          trap cleanup_failed_upload EXIT

          scp -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${payloads[@]}" "${checksums}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

          remote_checksums_name="$(basename -- "${checksums}")"
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' REMOTE_CHECKSUMS_NAME='${remote_checksums_name}' bash -s" <<'REMOTE_VERIFY'
          set -euo pipefail
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) echo 'Unsafe remote staging path.' >&2; exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          checksum_file="${REMOTE_DIR}/${REMOTE_CHECKSUMS_NAME}"
          test -f "${checksum_file}"
          test ! -L "${checksum_file}"
          test "$(stat -c '%U:%G' -- "${checksum_file}")" = 'root:root'
          chmod 600 -- "${checksum_file}"
          test "$(stat -c '%a' -- "${checksum_file}")" = '600'
          test -s "${checksum_file}"
          if grep -Eqv '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "${checksum_file}"; then
            echo 'Unsafe checksum manifest entry.' >&2
            exit 2
          fi
          while read -r digest staged_name; do
            test -n "${digest}"
            case "${staged_name}" in
              ''|*/*|.|..) echo 'Unsafe staged filename.' >&2; exit 2 ;;
            esac
            staged_file="${REMOTE_DIR}/${staged_name}"
            test -f "${staged_file}"
            test ! -L "${staged_file}"
            test "$(stat -c '%U:%G' -- "${staged_file}")" = 'root:root'
            chmod 600 -- "${staged_file}"
            test "$(stat -c '%a' -- "${staged_file}")" = '600'
          done < "${checksum_file}"
          (cd "${REMOTE_DIR}" && sha256sum -c -- "${REMOTE_CHECKSUMS_NAME}")
          REMOTE_VERIFY

          upload_complete=1
          trap - EXIT

      - name: Remote atomic release and gateway verification
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' REMOTE_ARCHIVE='${REMOTE_ARCHIVE}' RELEASE_NAME='${RELEASE_NAME}' DOMAIN='${DOMAIN}' BASE_PATH='${BASE_PATH}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          shared_assets_armed=0
          shared_root='/opt/rag-system/shared'
          shared_backup_dir="${REMOTE_DIR}/shared-assets"
          shared_backup_manifest="${REMOTE_DIR}/shared-assets.manifest"

          validate_remote_staging() {
            case "${REMOTE_DIR}" in
              "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
              *) echo "Unsafe release directory: ${REMOTE_DIR}" >&2; return 2 ;;
            esac
            test -d "${REMOTE_DIR}" || return 2
            test ! -L "${REMOTE_DIR}" || return 2
            test "$(readlink -f -- "${REMOTE_DIR}")" = "${REMOTE_DIR}" || return 2
            test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700' || return 2
          }

          validate_shared_target() {
            case "$1" in
              /opt/rag-system/shared/run-rag-system.sh|\
              /opt/rag-system/shared/run-rag-system.cjs|\
              /opt/rag-system/shared/rag-system.ecosystem.config.cjs|\
              /opt/rag-system/shared/manage-rag-system-pm2.sh) ;;
              *) echo "Unsafe shared runtime target: $1" >&2; return 2 ;;
            esac
          }

          cleanup_remote_staging() {
            validate_remote_staging || return
            rm -rf -- "${REMOTE_DIR}"
          }

          restore_shared_asset() {
            backup_name="$1"
            target="$2"
            case "${backup_name}" in
              run-rag-system.sh|run-rag-system.cjs|rag-system.ecosystem.config.cjs|manage-rag-system-pm2.sh) ;;
              *) echo "Unsafe shared runtime backup name: ${backup_name}" >&2; return 2 ;;
            esac
            backup="${shared_backup_dir}/${backup_name}"
            test -f "${backup}" || return 2
            test ! -L "${backup}" || return 2
            test "$(stat -c '%U:%G' -- "${backup}")" = 'root:root' || return 2
            stage="${target}.rollback.$$"
            rm -f -- "${stage}" || return
            cp -a -- "${backup}" "${stage}" || return
            mv -f -- "${stage}" "${target}"
          }

          rollback_shared_assets() {
            test -f "${shared_backup_manifest}" || return 2
            test ! -L "${shared_backup_manifest}" || return 2
            test "$(stat -c '%U:%G' -- "${shared_backup_manifest}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${shared_backup_manifest}")" = '600' || return 2
            while IFS=$'\t' read -r state backup_name target; do
              validate_shared_target "${target}" || return
              case "${state}" in
                present) restore_shared_asset "${backup_name}" "${target}" || return ;;
                absent) rm -f -- "${target}" || return ;;
                *) echo "Unsafe shared runtime backup state: ${state}" >&2; return 2 ;;
              esac
            done < "${shared_backup_manifest}"
            shared_assets_armed=0
          }

          remote_exit() {
            status=$?
            cleanup_allowed=1
            trap - EXIT
            if [ "${shared_assets_armed}" = '1' ]; then
              if ! rollback_shared_assets; then
                echo 'Failed to restore shared runtime assets.' >&2
                status=1
                cleanup_allowed=0
              fi
            fi
            if [ -e "${REMOTE_DIR}/post-release-gate-state/rollback.failed" ]; then
              echo 'Preserving protected staging after post-release rollback failure.' >&2
              cleanup_allowed=0
            fi
            if [ "${cleanup_allowed}" = '1' ]; then
              if ! cleanup_remote_staging; then
                echo 'Failed to remove verified remote staging.' >&2
                status=1
              fi
            else
              echo "Preserving protected staging for manual shared-asset recovery: ${REMOTE_DIR}" >&2
            fi
            exit "${status}"
          }
          trap remote_exit EXIT

          validate_remote_staging
          case "${REMOTE_ARCHIVE}" in
            "${REMOTE_DIR}"/*.tgz) ;;
            *) echo "Unsafe release archive: ${REMOTE_ARCHIVE}" >&2; exit 2 ;;
          esac
          test -f "${REMOTE_ARCHIVE}"
          test ! -L "${REMOTE_ARCHIVE}"
          test "$(stat -c '%U:%G' -- "${REMOTE_ARCHIVE}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_ARCHIVE}")" = '600'

          record_shared_asset() {
            backup_name="$1"
            target="$2"
            validate_shared_target "${target}"
            if [ -e "${target}" ] || [ -L "${target}" ]; then
              test -f "${target}"
              test ! -L "${target}"
              test "$(stat -c '%U:%G' -- "${target}")" = 'root:root'
              cp -a -- "${target}" "${shared_backup_dir}/${backup_name}"
              printf 'present\t%s\t%s\n' "${backup_name}" "${target}" >> "${shared_backup_manifest}"
            else
              printf 'absent\t%s\t%s\n' "${backup_name}" "${target}" >> "${shared_backup_manifest}"
            fi
          }

          prepare_shared_directory() {
            if [ -e "${shared_root}" ] || [ -L "${shared_root}" ]; then
              test -d "${shared_root}"
              test ! -L "${shared_root}"
            else
              install -d -o root -g root -m 0755 -- "${shared_root}"
            fi
            test "$(readlink -f -- "${shared_root}")" = "${shared_root}"
            test "$(stat -c '%U:%G' -- "${shared_root}")" = 'root:root'
            test "$(stat -c '%a' -- "${shared_root}")" = '755'
          }

          prepare_shared_asset_backup() {
            mkdir -m 700 -- "${shared_backup_dir}"
            : > "${shared_backup_manifest}"
            chmod 600 "${shared_backup_manifest}"
            record_shared_asset run-rag-system.sh '/opt/rag-system/shared/run-rag-system.sh'
            record_shared_asset run-rag-system.cjs '/opt/rag-system/shared/run-rag-system.cjs'
            record_shared_asset rag-system.ecosystem.config.cjs '/opt/rag-system/shared/rag-system.ecosystem.config.cjs'
            record_shared_asset manage-rag-system-pm2.sh '/opt/rag-system/shared/manage-rag-system-pm2.sh'
            shared_assets_armed=1
          }

          install_shared_asset() {
            source_name="$1"
            target="$2"
            mode="$3"
            validator="$4"
            stage="${target}.next.$$"
            tr -d '\r' < "${REMOTE_DIR}/${source_name}" > "${stage}"
            chmod "${mode}" "${stage}"
            case "${validator}" in
              bash) bash -n "${stage}" ;;
              # Staged files end in .next.<pid>, so passing the path makes
              # Node reject the temporary extension before it can parse CJS.
              node) node --check < "${stage}" ;;
              *) echo "Unknown shared asset validator: ${validator}" >&2; return 2 ;;
            esac
            if [ -f "${target}" ] && cmp -s "${stage}" "${target}"; then
              rm -f "${stage}"
              return 0
            fi
            if [ -f "${target}" ]; then
              cp -a "${target}" "${target}.bak.$(date +%Y%m%d%H%M%S)"
            fi
            mv -f "${stage}" "${target}"
          }

          lock_file='/run/lock/rag-system-env-reload.lock'
          if [ -e "${lock_file}" ] || [ -L "${lock_file}" ]; then
            test -f "${lock_file}"
            test ! -L "${lock_file}"
            test "$(stat -c '%U:%G' -- "${lock_file}")" = 'root:root'
          fi
          umask 077
          exec 9>"${lock_file}"
          chmod 600 "${lock_file}"
          flock -x 9

          prepare_shared_directory
          prepare_shared_asset_backup
          install_shared_asset run-rag-system.sh '/opt/rag-system/shared/run-rag-system.sh' 700 bash
          install_shared_asset run-rag-system.cjs '/opt/rag-system/shared/run-rag-system.cjs' 700 node
          install_shared_asset rag-system.ecosystem.config.cjs '/opt/rag-system/shared/rag-system.ecosystem.config.cjs' 600 node
          install_shared_asset manage-rag-system-pm2.sh '/opt/rag-system/shared/manage-rag-system-pm2.sh' 700 bash

          for script in release-host.sh post-release-gate.sh provision-postgres-host.sh patch-nginx.py apply-nginx.sh reload-rag-system-env.sh refresh-rag-nginx-token.sh; do
            tr -d '\r' < "${REMOTE_DIR}/${script}" > "${REMOTE_DIR}/${script}.normalized"
            mv -f "${REMOTE_DIR}/${script}.normalized" "${REMOTE_DIR}/${script}"
          done
          chmod 700 "${REMOTE_DIR}/release-host.sh" "${REMOTE_DIR}/post-release-gate.sh" "${REMOTE_DIR}/provision-postgres-host.sh" "${REMOTE_DIR}/apply-nginx.sh" "${REMOTE_DIR}/reload-rag-system-env.sh" "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          bash -n "${REMOTE_DIR}/release-host.sh"
          bash -n "${REMOTE_DIR}/post-release-gate.sh"
          bash -n "${REMOTE_DIR}/provision-postgres-host.sh"
          bash -n "${REMOTE_DIR}/apply-nginx.sh"
          bash -n "${REMOTE_DIR}/reload-rag-system-env.sh"
          bash -n "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          python3 -m py_compile "${REMOTE_DIR}/patch-nginx.py"

          RAG_POST_RELEASE_GATE="${REMOTE_DIR}/post-release-gate.sh" \
          RAG_RELEASE_GATE_ROOT="${REMOTE_DIR}" \
          RAG_ENV_RELOAD_LOCK_HELD=1 \
          RAG_POSTGRES_PROVISIONER="${REMOTE_DIR}/provision-postgres-host.sh" \
          RAG_ENV_DEFAULTS_RENDERER="${REMOTE_DIR}/render-host-env-defaults.py" \
          RAG_ENV_DEFAULTS_EXAMPLE="${REMOTE_DIR}/.env.container.example" \
          "${REMOTE_DIR}/release-host.sh" \
            "${REMOTE_ARCHIVE}" \
            "${RELEASE_NAME}"
          shared_assets_armed=0
          REMOTE_SCRIPT

      - name: Verify public deployment
        run: |
          set -euo pipefail
          live_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/rag-api/health/live")"
          echo "public liveness -> ${live_code}"
          test "${live_code}" = '200'
          portal_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/")"
          echo "public gateway -> ${portal_code}"
          test "${portal_code}" = '200'
          ui_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}${BASE_PATH}")"
          echo "public anonymous RAG UI -> ${ui_code}"
          test "${ui_code}" = '302'
