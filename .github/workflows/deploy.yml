name: Deploy RAG System to songuu.top

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: rag-system-production
  cancel-in-progress: false

permissions:
  contents: read

# Server deployment: build a Linux standalone artifact, atomically switch the
# host release symlink, then verify the isolated /rag-system gateway path.
# Required secret: RAG_SYSTEM_SSH_PRIVATE_KEY.
# Optional secrets: RAG_SYSTEM_DEPLOY_HOST, RAG_SYSTEM_DEPLOY_USER,
# RAG_SYSTEM_DOMAIN. Runtime model/vector credentials remain only on the host.
jobs:
  build-and-deploy:
    name: Build and deploy (server application)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "11.1.3"
      DEPLOY_HOST: ${{ secrets.RAG_SYSTEM_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.RAG_SYSTEM_DEPLOY_USER }}
      DOMAIN: ${{ secrets.RAG_SYSTEM_DOMAIN }}
      SSH_PRIVATE_KEY: ${{ secrets.RAG_SYSTEM_SSH_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set deployment defaults
        run: |
          set -euo pipefail
          {
            echo "DEPLOY_HOST=${DEPLOY_HOST:-47.253.230.197}"
            echo "DEPLOY_USER=${DEPLOY_USER:-root}"
            echo "DOMAIN=${DOMAIN:-songuu.top}"
            echo "BASE_PATH=/rag-system"
            echo "RELEASE_ROOT=/opt/rag-system/releases"
            echo "CURRENT_LINK=/opt/rag-system/current"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secret
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing required GitHub secret RAG_SYSTEM_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RAG quality gates
        run: |
          set -euo pipefail
          pnpm test
          pnpm exec tsc --noEmit --incremental false

      - name: Build Linux production image
        run: |
          set -euo pipefail
          unset STATIC_EXPORT
          image="rag-system:${GITHUB_SHA}"
          docker build --progress=plain \
            --build-arg RAG_BASE_PATH="${BASE_PATH}" \
            --tag "${image}" \
            .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Package standalone release
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.tgz"
          entries="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.entries"
          docker run --rm --entrypoint sh "${IMAGE}" \
            -c 'tar -C /app -czf - server.js .next public node_modules' > "${archive}"
          tar -tzf "${archive}" > "${entries}"
          grep -qx 'server.js' "${entries}"
          grep -q '^\.next/static/' "${entries}"
          grep -q '^node_modules/\.pnpm/onnxruntime-node@1\.14\.0/' "${entries}"
          sha256sum "${archive}"
          {
            echo "ARCHIVE=${archive}"
            echo "REMOTE_DIR=/tmp/rag-system-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "REMOTE_ARCHIVE=/tmp/rag-system-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/rag-system-${GITHUB_SHA}.tgz"
            echo "RELEASE_NAME=rag-system-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/rag_system_deploy_key
          chmod 600 ~/.ssh/rag_system_deploy_key
          ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release and host scripts
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            "${ARCHIVE}" \
            deploy/songuu/run-rag-system.sh \
            deploy/songuu/run-rag-system.cjs \
            deploy/songuu/rag-system.ecosystem.config.cjs \
            deploy/songuu/manage-rag-system-pm2.sh \
            deploy/songuu/release-host.sh \
            deploy/songuu/render-host-env-defaults.py \
            deploy/songuu/reload-rag-system-env.sh \
            deploy/songuu/refresh-rag-nginx-token.sh \
            deploy/songuu/rag-system-env-reload.service \
            deploy/songuu/rag-system-env-reload.path \
            deploy/songuu/patch-nginx.py \
            deploy/songuu/apply-nginx.sh \
            .env.container.example \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

      - name: Remote atomic release and gateway verification
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' REMOTE_ARCHIVE='${REMOTE_ARCHIVE}' RELEASE_NAME='${RELEASE_NAME}' DOMAIN='${DOMAIN}' BASE_PATH='${BASE_PATH}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          case "${REMOTE_DIR}" in
            /tmp/rag-system-*) ;;
            *) echo "Unsafe release directory: ${REMOTE_DIR}" >&2; exit 2 ;;
          esac
          case "${REMOTE_ARCHIVE}" in
            "${REMOTE_DIR}"/*.tgz) ;;
            *) echo "Unsafe release archive: ${REMOTE_ARCHIVE}" >&2; exit 2 ;;
          esac

          install_shared_asset() {
            source_name="$1"
            target="$2"
            mode="$3"
            validator="$4"
            stage="${target}.next.$$"
            tr -d '\r' < "${REMOTE_DIR}/${source_name}" > "${stage}"
            chmod "${mode}" "${stage}"
            case "${validator}" in
              bash) bash -n "${stage}" ;;
              # Staged files end in .next.<pid>, so passing the path makes
              # Node reject the temporary extension before it can parse CJS.
              node) node --check < "${stage}" ;;
              *) echo "Unknown shared asset validator: ${validator}" >&2; return 2 ;;
            esac
            if [ -f "${target}" ] && cmp -s "${stage}" "${target}"; then
              rm -f "${stage}"
              return 0
            fi
            if [ -f "${target}" ]; then
              cp -a "${target}" "${target}.bak.$(date +%Y%m%d%H%M%S)"
            fi
            mv -f "${stage}" "${target}"
          }

          install_shared_asset run-rag-system.sh '/opt/rag-system/shared/run-rag-system.sh' 700 bash
          install_shared_asset run-rag-system.cjs '/opt/rag-system/shared/run-rag-system.cjs' 700 node
          install_shared_asset rag-system.ecosystem.config.cjs '/opt/rag-system/shared/rag-system.ecosystem.config.cjs' 600 node
          install_shared_asset manage-rag-system-pm2.sh '/opt/rag-system/shared/manage-rag-system-pm2.sh' 700 bash

          for script in release-host.sh patch-nginx.py apply-nginx.sh reload-rag-system-env.sh refresh-rag-nginx-token.sh; do
            tr -d '\r' < "${REMOTE_DIR}/${script}" > "${REMOTE_DIR}/${script}.normalized"
            mv -f "${REMOTE_DIR}/${script}.normalized" "${REMOTE_DIR}/${script}"
          done
          chmod 700 "${REMOTE_DIR}/release-host.sh" "${REMOTE_DIR}/apply-nginx.sh" "${REMOTE_DIR}/reload-rag-system-env.sh" "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          bash -n "${REMOTE_DIR}/release-host.sh"
          bash -n "${REMOTE_DIR}/apply-nginx.sh"
          bash -n "${REMOTE_DIR}/reload-rag-system-env.sh"
          bash -n "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          python3 -m py_compile "${REMOTE_DIR}/patch-nginx.py"

          RAG_ENV_DEFAULTS_RENDERER="${REMOTE_DIR}/render-host-env-defaults.py" \
          RAG_ENV_DEFAULTS_EXAMPLE="${REMOTE_DIR}/.env.container.example" \
          "${REMOTE_DIR}/release-host.sh" \
            "${REMOTE_ARCHIVE}" \
            "${RELEASE_NAME}"

          reload_runner='/opt/rag-system/shared/reload-rag-system-env.sh'
          reload_runner_stage="${reload_runner}.next.$$"
          tr -d '\r' < "${REMOTE_DIR}/reload-rag-system-env.sh" > "${reload_runner_stage}"
          chmod 700 "${reload_runner_stage}"
          bash -n "${reload_runner_stage}"
          if [ -f "${reload_runner}" ]; then
            cp -a "${reload_runner}" "${reload_runner}.bak.$(date +%Y%m%d%H%M%S)"
          fi
          mv -f "${reload_runner_stage}" "${reload_runner}"

          for file in patch-nginx.py refresh-rag-nginx-token.sh; do
            target="/opt/rag-system/shared/${file}"
            stage="${target}.next.$$"
            tr -d '\r' < "${REMOTE_DIR}/${file}" > "${stage}"
            if [ "${file}" = 'refresh-rag-nginx-token.sh' ]; then
              chmod 700 "${stage}"
              bash -n "${stage}"
            fi
            if [ -f "${target}" ]; then
              cp -a "${target}" "${target}.bak.$(date +%Y%m%d%H%M%S)"
            fi
            mv -f "${stage}" "${target}"
          done

          for unit in rag-system-env-reload.service rag-system-env-reload.path; do
            unit_target="/etc/systemd/system/${unit}"
            unit_stage="${unit_target}.next.$$"
            tr -d '\r' < "${REMOTE_DIR}/${unit}" > "${unit_stage}"
            chmod 644 "${unit_stage}"
            if [ -f "${unit_target}" ]; then
              cp -a "${unit_target}" "${unit_target}.bak.$(date +%Y%m%d%H%M%S)"
            fi
            mv -f "${unit_stage}" "${unit_target}"
          done
          systemctl daemon-reload
          systemctl enable --now rag-system-env-reload.path

          location_count() {
            awk -v modifier="$1" -v route="$2" \
              '$1 == "location" && $2 == modifier && $3 == route { count++ } END { print count + 0 }' \
              /etc/nginx/conf.d/default.conf
          }

          root_location="$(location_count '=' '/rag-system')"
          direct_api_location="$(location_count '^~' '/rag-system/api/')"
          page_location="$(location_count '^~' '/rag-system/')"
          live_location="$(location_count '=' '/rag-api/health/live')"
          api_location="$(location_count '^~' '/rag-api/')"
          if [ "${root_location}" = "0" ] && \
             [ "${direct_api_location}" = "0" ] && \
             [ "${page_location}" = "0" ] && \
             [ "${live_location}" = "0" ] && \
             [ "${api_location}" = "0" ]; then
            "${REMOTE_DIR}/apply-nginx.sh" "${REMOTE_DIR}/patch-nginx.py"
          elif [ "${root_location}" != "1" ] || \
               [ "${direct_api_location}" != "1" ] || \
               [ "${page_location}" != "1" ] || \
               [ "${live_location}" != "1" ] || \
               [ "${api_location}" != "1" ]; then
            echo 'RAG Nginx locations are incomplete or ambiguous; refusing deployment.' >&2
            exit 1
          fi

          # Keep the gateway's injected bearer token synchronized before
          # recording this environment as the watcher's verified baseline.
          # That makes a later token edit detectable rather than silently
          # treating it as an ordinary PM2 reload.
          "${REMOTE_DIR}/refresh-rag-nginx-token.sh" "${REMOTE_DIR}/patch-nginx.py" >/dev/null

          live_code="$(curl -sk -o /dev/null -w '%{http_code}' -H "Host:${DOMAIN}" "https://127.0.0.1/rag-api/health/live")"
          test "${live_code}" = '200'
          anonymous_ui_code="$(curl -sk -o /dev/null -w '%{http_code}' -H "Host:${DOMAIN}" "https://127.0.0.1${BASE_PATH}")"
          test "${anonymous_ui_code}" = '302'
          direct_api_code="$(curl -sk -o /dev/null -w '%{http_code}' -H "Host:${DOMAIN}" "https://127.0.0.1${BASE_PATH}/api/health/live")"
          test "${direct_api_code}" = '404'

          # Seed watcher state only after the app and the RAG gateway have
          # passed verification. Do not let the first edited candidate become
          # its own baseline; that would hide a tenant-token rotation.
          env_file='/opt/rag-system/shared/.env.prod'
          last_good='/opt/rag-system/shared/.env.prod.last-known-good'
          applied_hash='/opt/rag-system/shared/.env.prod.last-applied.sha256'
          test -r "${env_file}"
          env_hash="$(sha256sum "${env_file}" | cut -d' ' -f1)"
          last_good_stage="${last_good}.next.$$"
          cp -a "${env_file}" "${last_good_stage}"
          chmod 600 "${last_good_stage}"
          if [ "${env_hash}" != "$(sha256sum "${env_file}" | cut -d' ' -f1)" ]; then
            rm -f "${last_good_stage}"
            echo 'RAG environment changed while seeding watcher state; refusing an ambiguous baseline.' >&2
            exit 1
          fi
          mv -f "${last_good_stage}" "${last_good}"
          printf '%s\n' "${env_hash}" > "${applied_hash}.next.$$"
          chmod 600 "${applied_hash}.next.$$"
          mv -f "${applied_hash}.next.$$" "${applied_hash}"
          rm -rf "${REMOTE_DIR}"
          REMOTE_SCRIPT

      - name: Verify public deployment
        run: |
          set -euo pipefail
          live_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/rag-api/health/live")"
          echo "public liveness -> ${live_code}"
          test "${live_code}" = '200'
          portal_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/")"
          echo "public gateway -> ${portal_code}"
          test "${portal_code}" = '200'
          ui_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}${BASE_PATH}")"
          echo "public anonymous RAG UI -> ${ui_code}"
          test "${ui_code}" = '302'
