name: Deploy RAG System to songuu.top

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: rag-system-production
  cancel-in-progress: false

permissions:
  contents: read

# Server deployment: build a Linux standalone artifact, atomically switch the
# host release symlink, then verify the isolated /rag-system gateway path.
# Required secret: RAG_SYSTEM_SSH_PRIVATE_KEY. A non-default DEPLOY_HOST also
# requires RAG_SYSTEM_SSH_KNOWN_HOSTS; the default host key is pinned in-repo.
# Optional secrets: RAG_SYSTEM_DEPLOY_HOST, RAG_SYSTEM_DEPLOY_USER,
# RAG_SYSTEM_DOMAIN. Runtime model/vector credentials remain only on the host.
jobs:
  build-and-deploy:
    name: Build and deploy (server application)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_USER: rag_ci_owner
          POSTGRES_PASSWORD: rag_ci_ephemeral_password
          POSTGRES_DB: rag_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci_owner -d rag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "11.1.3"
      DEPLOY_HOST: ${{ secrets.RAG_SYSTEM_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.RAG_SYSTEM_DEPLOY_USER }}
      DOMAIN: ${{ secrets.RAG_SYSTEM_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set deployment defaults
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST:-47.253.230.197}"
          if [[ ! "${DEPLOY_HOST}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] \
            || [[ "${DEPLOY_HOST}" = *..* ]] \
            || (( ${#DEPLOY_HOST} > 253 )); then
            echo '::error::Unsafe DEPLOY_HOST; expected an IPv4 address or DNS hostname'
            exit 2
          fi
          {
            echo "DEPLOY_HOST=${DEPLOY_HOST}"
            echo "DEPLOY_USER=${DEPLOY_USER:-root}"
            echo "DOMAIN=${DOMAIN:-songuu.top}"
            echo "BASE_PATH=/rag-system"
            echo "RELEASE_ROOT=/opt/rag-system/releases"
            echo "CURRENT_LINK=/opt/rag-system/current"
            echo "REMOTE_PARENT=/opt/rag-system/staging"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RAG_SYSTEM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing required GitHub secret RAG_SYSTEM_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RAG quality gates
        env:
          TEST_DATABASE_URL: postgresql://rag_ci_owner:rag_ci_ephemeral_password@127.0.0.1:54329/rag_ci
        run: |
          set -euo pipefail
          node scripts/verify-postgres-public.test.mjs
          pnpm test
          pnpm test:postgres:integration
          pnpm exec tsc --noEmit --incremental false

      - name: Build Linux production image
        run: |
          set -euo pipefail
          unset STATIC_EXPORT
          image="rag-system:${GITHUB_SHA}"
          docker build --progress=plain \
            --build-arg RAG_BASE_PATH="${BASE_PATH}" \
            --tag "${image}" \
            .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Package standalone release
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.tgz"
          entries="${RUNNER_TEMP}/rag-system-${GITHUB_SHA}.entries"
          docker run --rm --entrypoint sh "${IMAGE}" \
            -c 'tar -C /app --owner=0 --group=0 --numeric-owner -czf - server.js .next public node_modules db/postgres scripts/migrate-postgres.mjs scripts/backfill-local-postgres.mjs scripts/verify-postgres-runtime.mjs' > "${archive}"
          tar -tzf "${archive}" > "${entries}"
          grep -qx 'server.js' "${entries}"
          grep -q '^\.next/static/' "${entries}"
          grep -q '^node_modules/\.pnpm/onnxruntime-node@1\.14\.0/' "${entries}"
          grep -qx 'db/postgres/bootstrap.sql' "${entries}"
          grep -Eq '^db/postgres/migrations/.+\.sql$' "${entries}"
          grep -qx 'scripts/migrate-postgres.mjs' "${entries}"
          grep -qx 'scripts/backfill-local-postgres.mjs' "${entries}"
          grep -qx 'scripts/verify-postgres-runtime.mjs' "${entries}"
          tar --numeric-owner -tvzf "${archive}" | awk '$2 != "0/0" { exit 1 }'
          sha256sum "${archive}"
          {
            echo "ARCHIVE=${archive}"
            echo "RELEASE_NAME=rag-system-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RAG_SYSTEM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RAG_SYSTEM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/rag_system_deploy_key
          chmod 600 ~/.ssh/rag_system_deploy_key
          if [ "${DEPLOY_HOST}" = '47.253.230.197' ]; then
            if [ -n "${SSH_KNOWN_HOSTS}" ]; then
              echo 'RAG_SYSTEM_SSH_KNOWN_HOSTS is only accepted for a non-default DEPLOY_HOST.' >&2
              exit 2
            fi
            install -m 600 deploy/songuu/ssh-known-hosts ~/.ssh/known_hosts
          else
            if [ -z "${SSH_KNOWN_HOSTS}" ]; then
              echo '::error::Missing required GitHub secret RAG_SYSTEM_SSH_KNOWN_HOSTS for non-default DEPLOY_HOST'
              exit 1
            fi
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          if ! ssh-keygen -F "${DEPLOY_HOST}" -f ~/.ssh/known_hosts >/dev/null; then
            echo '::error::Pinned known_hosts does not contain DEPLOY_HOST'
            exit 1
          fi

      - name: Create secure remote staging
        run: |
          set -euo pipefail
          remote_dir="$(
            ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "REMOTE_PARENT='${REMOTE_PARENT}' bash -s" <<'REMOTE_STAGE'
          set -euo pipefail
          test "$(id -u)" = '0'
          remote_root="$(dirname -- "${REMOTE_PARENT}")"
          test "${remote_root}" = '/opt/rag-system'
          if [ -e "${remote_root}" ] || [ -L "${remote_root}" ]; then
            test -d "${remote_root}"
            test ! -L "${remote_root}"
          else
            install -d -o root -g root -m 0755 -- "${remote_root}"
          fi
          test "$(readlink -f -- "${remote_root}")" = "${remote_root}"
          test "$(stat -c '%U:%G' -- "${remote_root}")" = 'root:root'
          test "$(stat -c '%a' -- "${remote_root}")" = '755'
          if [ -e "${REMOTE_PARENT}" ] || [ -L "${REMOTE_PARENT}" ]; then
            test -d "${REMOTE_PARENT}"
            test ! -L "${REMOTE_PARENT}"
          else
            install -d -o root -g root -m 0755 -- "${REMOTE_PARENT}"
          fi
          test "$(readlink -f -- "${REMOTE_PARENT}")" = "${REMOTE_PARENT}"
          test "$(stat -c '%U:%G' -- "${REMOTE_PARENT}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_PARENT}")" = '755'
          umask 077
          remote_dir="$(mktemp -d "${REMOTE_PARENT}/rag-system.XXXXXXXXXX")"
          test -d "${remote_dir}"
          test ! -L "${remote_dir}"
          test "$(stat -c '%U:%G' -- "${remote_dir}")" = 'root:root'
          test "$(stat -c '%a' -- "${remote_dir}")" = '700'
          printf '%s\n' "${remote_dir}"
          REMOTE_STAGE
          )"
          case "${remote_dir}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) echo 'Remote staging returned an unsafe path.' >&2; exit 2 ;;
          esac
          archive_name="$(basename -- "${ARCHIVE}")"
          {
            printf 'REMOTE_DIR=%s\n' "${remote_dir}"
            printf 'REMOTE_ARCHIVE=%s/%s\n' "${remote_dir}" "${archive_name}"
          } >> "$GITHUB_ENV"

      - name: Upload release and host scripts
        run: |
          set -euo pipefail
          payloads=(
            "${ARCHIVE}"
            deploy/songuu/run-rag-system.sh
            deploy/songuu/run-rag-system.cjs
            deploy/songuu/rag-system.ecosystem.config.cjs
            deploy/songuu/manage-rag-system-pm2.sh
            deploy/songuu/release-host.sh
            deploy/songuu/post-release-gate.sh
            deploy/songuu/provision-postgres-host.sh
            deploy/songuu/render-host-env-defaults.py
            deploy/songuu/reload-rag-system-env.sh
            deploy/songuu/refresh-rag-nginx-token.sh
            deploy/songuu/rag-system-env-reload.service
            deploy/songuu/rag-system-env-reload.path
            deploy/songuu/patch-nginx.py
            deploy/songuu/apply-nginx.sh
            .env.container.example
          )
          checksums="${RUNNER_TEMP}/rag-system-sha256sums.txt"
          : > "${checksums}"
          for source in "${payloads[@]}"; do
            test -f "${source}"
            digest="$(sha256sum "${source}" | cut -d' ' -f1)"
            printf '%s  %s\n' "${digest}" "$(basename -- "${source}")" >> "${checksums}"
          done
          chmod 600 "${checksums}"

          upload_complete=0
          cleanup_failed_upload() {
            status=$?
            trap - EXIT
            if [ "${upload_complete}" != '1' ]; then
              ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE_CLEANUP' || true
          set -euo pipefail
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          rm -rf -- "${REMOTE_DIR}"
          REMOTE_CLEANUP
            fi
            exit "${status}"
          }
          trap cleanup_failed_upload EXIT

          scp -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${payloads[@]}" "${checksums}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

          remote_checksums_name="$(basename -- "${checksums}")"
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' REMOTE_CHECKSUMS_NAME='${remote_checksums_name}' bash -s" <<'REMOTE_VERIFY'
          set -euo pipefail
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) echo 'Unsafe remote staging path.' >&2; exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          checksum_file="${REMOTE_DIR}/${REMOTE_CHECKSUMS_NAME}"
          test -f "${checksum_file}"
          test ! -L "${checksum_file}"
          test "$(stat -c '%U:%G' -- "${checksum_file}")" = 'root:root'
          chmod 600 -- "${checksum_file}"
          test "$(stat -c '%a' -- "${checksum_file}")" = '600'
          test -s "${checksum_file}"
          if grep -Eqv '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "${checksum_file}"; then
            echo 'Unsafe checksum manifest entry.' >&2
            exit 2
          fi
          while read -r digest staged_name; do
            test -n "${digest}"
            case "${staged_name}" in
              ''|*/*|.|..) echo 'Unsafe staged filename.' >&2; exit 2 ;;
            esac
            staged_file="${REMOTE_DIR}/${staged_name}"
            test -f "${staged_file}"
            test ! -L "${staged_file}"
            test "$(stat -c '%U:%G' -- "${staged_file}")" = 'root:root'
            chmod 600 -- "${staged_file}"
            test "$(stat -c '%a' -- "${staged_file}")" = '600'
          done < "${checksum_file}"
          (cd "${REMOTE_DIR}" && sha256sum -c -- "${REMOTE_CHECKSUMS_NAME}")
          REMOTE_VERIFY

          upload_complete=1
          trap - EXIT

      - name: Provision public PostgreSQL host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' RAG_POSTGRES_PUBLIC_HOST='${DEPLOY_HOST}' RAG_POSTGRES_CUTOVER_TOKEN='${RELEASE_NAME}' bash -s" <<'REMOTE_POSTGRES'
          set -euo pipefail
          prepare_succeeded=0
          shared_root='/opt/rag-system/shared'
          provisioner="${REMOTE_DIR}/provision-postgres-host.sh"

          validate_preflight_staging() {
            case "${REMOTE_DIR}" in
              "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
              *) echo 'Unsafe PostgreSQL preflight staging path.' >&2; return 2 ;;
            esac
            test -d "${REMOTE_DIR}" || return 2
            test ! -L "${REMOTE_DIR}" || return 2
            test "$(readlink -f -- "${REMOTE_DIR}")" = "${REMOTE_DIR}" || return 2
            test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700' || return 2
          }

          cleanup_failed_preflight() {
            status=$?
            trap - EXIT
            if [ "${status}" -ne 0 ]; then
              if validate_preflight_staging; then
                if [ "${prepare_succeeded}" = '1' ]; then
                  if [ -f "${provisioner}" ] && [ ! -L "${provisioner}" ] && [ -x "${provisioner}" ]; then
                    RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
                    RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
                    RAG_POSTGRES_CUTOVER_ACTION=rollback \
                      "${provisioner}" \
                      '/opt/rag-system/shared/.env.prod' \
                      '/opt/rag-system/shared/.postgres-migration.env' \
                      || status=1
                  else
                    status=1
                  fi
                fi
                echo "Preserving protected PostgreSQL preflight staging for token-scoped recovery: ${REMOTE_DIR}" >&2
              else
                echo 'Could not validate PostgreSQL preflight staging for recovery.' >&2
                status=1
              fi
            fi
            exit "${status}"
          }
          trap cleanup_failed_preflight EXIT

          validate_preflight_staging
          if [ -e "${shared_root}" ] || [ -L "${shared_root}" ]; then
            test -d "${shared_root}"
            test ! -L "${shared_root}"
          else
            install -d -o root -g root -m 0755 -- "${shared_root}"
          fi
          test "$(readlink -f -- "${shared_root}")" = "${shared_root}"
          test "$(stat -c '%U:%G' -- "${shared_root}")" = 'root:root'

          test -f "${provisioner}"
          test ! -L "${provisioner}"
          test "$(stat -c '%U:%G' -- "${provisioner}")" = 'root:root'
          tr -d '\r' < "${provisioner}" > "${provisioner}.normalized"
          mv -f -- "${provisioner}.normalized" "${provisioner}"
          chmod 700 -- "${provisioner}"
          bash -n "${provisioner}"

          RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
          RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
          RAG_POSTGRES_CUTOVER_ACTION=prepare \
            "${provisioner}" \
            '/opt/rag-system/shared/.env.prod' \
            '/opt/rag-system/shared/.postgres-migration.env'
          prepare_succeeded=1
          REMOTE_POSTGRES

      - name: Verify public PostgreSQL TLS endpoint
        run: |
          set -euo pipefail
          readonly postgres_public_port='25432'
          probe_dir="$(mktemp -d "${RUNNER_TEMP}/rag-postgres-public.XXXXXXXXXX")"
          chmod 700 -- "${probe_dir}"
          postgres_ca="${probe_dir}/ca.crt"
          public_client_env="${probe_dir}/rag-app-client.env"

          cleanup_public_postgres_probe() {
            status=$?
            trap - EXIT
            set +e
            unset PGPASSWORD PGHOST PGPORT PGDATABASE PGUSER PGSSLMODE PGSSLROOTCERT
            unset POSTGRES_PUBLIC_EXPECTED_HOST POSTGRES_PUBLIC_VERIFY_PHASE
            rm -f -- "${postgres_ca}" "${public_client_env}" || status=1
            rmdir -- "${probe_dir}" || status=1
            if [ "${status}" -ne 0 ]; then
              if ! ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' RAG_POSTGRES_PUBLIC_HOST='${DEPLOY_HOST}' RAG_POSTGRES_CUTOVER_TOKEN='${RELEASE_NAME}' bash -s" <<'REMOTE_CLEANUP'
          set -euo pipefail
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(readlink -f -- "${REMOTE_DIR}")" = "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          provisioner="${REMOTE_DIR}/provision-postgres-host.sh"
          test -f "${provisioner}"
          test ! -L "${provisioner}"
          test -x "${provisioner}"
          RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
          RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
          RAG_POSTGRES_CUTOVER_ACTION=rollback \
            "${provisioner}" \
            '/opt/rag-system/shared/.env.prod' \
            '/opt/rag-system/shared/.postgres-migration.env'
          rm -rf -- "${REMOTE_DIR}"
          REMOTE_CLEANUP
              then
                echo '::error::Failed to clean protected staging after PostgreSQL preflight failure'
                status=1
              fi
            fi
            exit "${status}"
          }
          trap cleanup_public_postgres_probe EXIT

          scp -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rag-system/shared/.postgres-host/tls/ca.crt" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rag-system/shared/.postgres-host/tls/rag-app-client.env" \
            "${probe_dir}/"
          chmod 600 -- "${postgres_ca}" "${public_client_env}"
          for protected_file in "${postgres_ca}" "${public_client_env}"; do
            test -s "${protected_file}"
            test ! -L "${protected_file}"
            test "$(stat -c '%a' -- "${protected_file}")" = '600'
          done
          if [ "$(wc -l < "${public_client_env}")" -ne 7 ] \
            || grep -Eqv "^(PGHOST|PGPORT|PGDATABASE|PGUSER|PGPASSWORD|PGSSLMODE|PGSSLROOTCERT)='[A-Za-z0-9._:/-]+'$" "${public_client_env}"; then
            echo '::error::PostgreSQL public client environment has an unsafe contract'
            exit 1
          fi
          for client_key in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD PGSSLMODE PGSSLROOTCERT; do
            if [ "$(grep -c "^${client_key}=" "${public_client_env}")" -ne 1 ]; then
              echo '::error::PostgreSQL public client environment has duplicate or missing keys'
              exit 1
            fi
          done
          set -a
          # This root-owned file was syntax-constrained above before sourcing.
          . "${public_client_env}"
          set +a
          export PGSSLMODE='verify-full'
          PGSSLROOTCERT="$(readlink -f -- "${postgres_ca}")"
          export PGSSLROOTCERT
          POSTGRES_PUBLIC_EXPECTED_HOST="${DEPLOY_HOST}"
          export POSTGRES_PUBLIC_EXPECTED_HOST
          POSTGRES_PUBLIC_VERIFY_PHASE='network'
          export POSTGRES_PUBLIC_VERIFY_PHASE

          if ! timeout 30 node scripts/verify-postgres-public.mjs; then
            echo "::error::PostgreSQL public network/TLS verification failed on TCP/${postgres_public_port}; confirm the cloud security group allows this port from the runner"
            exit 1
          fi
          unset PGPASSWORD
          echo "PostgreSQL public network/TLS/auth endpoint verified on TCP/${postgres_public_port}; cutover remains prepared for the locked release transaction"

      - name: Remote atomic release and gateway verification
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' REMOTE_ARCHIVE='${REMOTE_ARCHIVE}' RELEASE_NAME='${RELEASE_NAME}' DOMAIN='${DOMAIN}' BASE_PATH='${BASE_PATH}' RAG_POSTGRES_PUBLIC_HOST='${DEPLOY_HOST}' RAG_POSTGRES_CUTOVER_TOKEN='${RELEASE_NAME}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          shared_assets_armed=0
          shared_root='/opt/rag-system/shared'
          shared_backup_dir="${REMOTE_DIR}/shared-assets"
          shared_backup_manifest="${REMOTE_DIR}/shared-assets.manifest"
          release_receipt="${REMOTE_DIR}/release-state.receipt"
          app_release_state=''

          validate_remote_staging() {
            case "${REMOTE_DIR}" in
              "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
              *) echo "Unsafe release directory: ${REMOTE_DIR}" >&2; return 2 ;;
            esac
            test -d "${REMOTE_DIR}" || return 2
            test ! -L "${REMOTE_DIR}" || return 2
            test "$(readlink -f -- "${REMOTE_DIR}")" = "${REMOTE_DIR}" || return 2
            test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700' || return 2
          }

          validate_shared_target() {
            case "$1" in
              /opt/rag-system/shared/run-rag-system.sh|\
              /opt/rag-system/shared/run-rag-system.cjs|\
              /opt/rag-system/shared/rag-system.ecosystem.config.cjs|\
              /opt/rag-system/shared/manage-rag-system-pm2.sh) ;;
              *) echo "Unsafe shared runtime target: $1" >&2; return 2 ;;
            esac
          }

          cleanup_remote_staging() {
            validate_remote_staging || return
            rm -rf -- "${REMOTE_DIR}"
          }

          restore_shared_asset() {
            backup_name="$1"
            target="$2"
            case "${backup_name}" in
              run-rag-system.sh|run-rag-system.cjs|rag-system.ecosystem.config.cjs|manage-rag-system-pm2.sh) ;;
              *) echo "Unsafe shared runtime backup name: ${backup_name}" >&2; return 2 ;;
            esac
            backup="${shared_backup_dir}/${backup_name}"
            test -f "${backup}" || return 2
            test ! -L "${backup}" || return 2
            test "$(stat -c '%U:%G' -- "${backup}")" = 'root:root' || return 2
            stage="${target}.rollback.$$"
            rm -f -- "${stage}" || return
            cp -a -- "${backup}" "${stage}" || return
            mv -f -- "${stage}" "${target}"
          }

          rollback_shared_assets() {
            test -f "${shared_backup_manifest}" || return 2
            test ! -L "${shared_backup_manifest}" || return 2
            test "$(stat -c '%U:%G' -- "${shared_backup_manifest}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${shared_backup_manifest}")" = '600' || return 2
            while IFS=$'\t' read -r state backup_name target; do
              validate_shared_target "${target}" || return
              case "${state}" in
                present) restore_shared_asset "${backup_name}" "${target}" || return ;;
                absent) rm -f -- "${target}" || return ;;
                *) echo "Unsafe shared runtime backup state: ${state}" >&2; return 2 ;;
              esac
            done < "${shared_backup_manifest}"
            shared_assets_armed=0
          }

          rollback_pending_postgres() {
            validate_remote_staging || return
            provisioner="${REMOTE_DIR}/provision-postgres-host.sh"
            test -f "${provisioner}" || return 2
            test ! -L "${provisioner}" || return 2
            test -x "${provisioner}" || return 2
            test "$(stat -c '%U:%G' -- "${provisioner}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${provisioner}")" = '700' || return 2
            RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
            RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
            RAG_POSTGRES_CUTOVER_ACTION=rollback \
              "${provisioner}" \
              '/opt/rag-system/shared/.env.prod' \
              '/opt/rag-system/shared/.postgres-migration.env'
          }

          reconcile_committed_postgres() {
            validate_remote_staging || return
            provisioner="${REMOTE_DIR}/provision-postgres-host.sh"
            test -f "${provisioner}" || return 2
            test ! -L "${provisioner}" || return 2
            test -x "${provisioner}" || return 2
            test "$(stat -c '%U:%G' -- "${provisioner}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${provisioner}")" = '700' || return 2
            RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
            RAG_POSTGRES_CUTOVER_ACTION=verify \
              "${provisioner}" \
              '/opt/rag-system/shared/.env.prod' \
              '/opt/rag-system/shared/.postgres-migration.env'
          }

          validate_app_release_receipt() {
            validate_remote_staging || return
            test "${release_receipt}" = "${REMOTE_DIR}/release-state.receipt" || return 2
            test -f "${release_receipt}" || return 2
            test ! -L "${release_receipt}" || return 2
            test "$(readlink -f -- "${release_receipt}")" = "${release_receipt}" || return 2
            test "$(stat -c '%U:%G' -- "${release_receipt}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${release_receipt}")" = '600' || return 2
            test "$(wc -l < "${release_receipt}" | tr -d '[:space:]')" = '3' || return 2
            test "$(grep -c '^release=' "${release_receipt}")" = '1' || return 2
            test "$(grep -c '^token=' "${release_receipt}")" = '1' || return 2
            test "$(grep -c '^state=' "${release_receipt}")" = '1' || return 2
            receipt_release="$(awk -F= '$1 == "release" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            receipt_token="$(awk -F= '$1 == "token" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            receipt_state="$(awk -F= '$1 == "state" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            test "${receipt_release}" = "${RELEASE_NAME}" || return 2
            test "${receipt_token}" = "${RAG_POSTGRES_CUTOVER_TOKEN}" || return 2
            case "${receipt_state}" in
              app-committed|app-rolled-back) ;;
              *) return 2 ;;
            esac
            app_release_state="${receipt_state}"
          }

          remote_exit() {
            status=$?
            cleanup_allowed=1
            app_recovery_authorized=0
            trap - EXIT
            if [ "${status}" -ne 0 ]; then
              if ! validate_app_release_receipt; then
                echo 'No valid durable app receipt exists; preserving PostgreSQL, app/current, shared assets, and protected staging for manual reconciliation.' >&2
                status=1
                cleanup_allowed=0
              elif [ "${app_release_state}" = 'app-committed' ]; then
                if reconcile_committed_postgres; then
                  shared_assets_armed=0
                  cleanup_allowed=0
                  echo 'Durable app and PostgreSQL receipts confirm the release is committed; preserving the new app environment and shared runtime assets.' >&2
                else
                  echo 'The app receipt is committed but PostgreSQL commit proof failed; preserving all release state for manual reconciliation.' >&2
                  status=1
                  cleanup_allowed=0
                fi
              else
                app_recovery_authorized=1
                if ! rollback_pending_postgres; then
                  echo 'Failed to roll back PostgreSQL after the durable app rollback receipt; preserving protected staging.' >&2
                  status=1
                  cleanup_allowed=0
                  if validate_remote_staging; then
                    umask 077
                    if ! {
                      printf '%s\n' 'PostgreSQL pending cutover rollback failed during remote release cleanup.' \
                        > "${REMOTE_DIR}/postgres-rollback.failed" \
                        && chmod 600 -- "${REMOTE_DIR}/postgres-rollback.failed"
                    }; then
                      echo 'Could not write the PostgreSQL rollback failure marker.' >&2
                    fi
                  fi
                fi
              fi
            fi
            if [ "${app_recovery_authorized}" = '1' ] && [ "${shared_assets_armed}" = '1' ]; then
              if ! rollback_shared_assets; then
                echo 'Failed to restore shared runtime assets.' >&2
                status=1
                cleanup_allowed=0
              fi
            fi
            if [ -e "${REMOTE_DIR}/post-release-gate-state/rollback.failed" ]; then
              echo 'Preserving protected staging after post-release rollback failure.' >&2
              cleanup_allowed=0
            fi
            if [ "${cleanup_allowed}" = '1' ]; then
              if ! cleanup_remote_staging; then
                echo 'Failed to remove verified remote staging.' >&2
                status=1
              fi
            else
              echo "Preserving protected staging for manual release recovery: ${REMOTE_DIR}" >&2
            fi
            exit "${status}"
          }
          trap remote_exit EXIT

          validate_remote_staging
          case "${REMOTE_ARCHIVE}" in
            "${REMOTE_DIR}"/*.tgz) ;;
            *) echo "Unsafe release archive: ${REMOTE_ARCHIVE}" >&2; exit 2 ;;
          esac
          test -f "${REMOTE_ARCHIVE}"
          test ! -L "${REMOTE_ARCHIVE}"
          test "$(stat -c '%U:%G' -- "${REMOTE_ARCHIVE}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_ARCHIVE}")" = '600'

          record_shared_asset() {
            backup_name="$1"
            target="$2"
            validate_shared_target "${target}"
            if [ -e "${target}" ] || [ -L "${target}" ]; then
              test -f "${target}"
              test ! -L "${target}"
              test "$(stat -c '%U:%G' -- "${target}")" = 'root:root'
              cp -a -- "${target}" "${shared_backup_dir}/${backup_name}"
              printf 'present\t%s\t%s\n' "${backup_name}" "${target}" >> "${shared_backup_manifest}"
            else
              printf 'absent\t%s\t%s\n' "${backup_name}" "${target}" >> "${shared_backup_manifest}"
            fi
          }

          prepare_shared_directory() {
            if [ -e "${shared_root}" ] || [ -L "${shared_root}" ]; then
              test -d "${shared_root}"
              test ! -L "${shared_root}"
            else
              install -d -o root -g root -m 0755 -- "${shared_root}"
            fi
            test "$(readlink -f -- "${shared_root}")" = "${shared_root}"
            test "$(stat -c '%U:%G' -- "${shared_root}")" = 'root:root'
            test "$(stat -c '%a' -- "${shared_root}")" = '755'
          }

          prepare_shared_asset_backup() {
            mkdir -m 700 -- "${shared_backup_dir}"
            : > "${shared_backup_manifest}"
            chmod 600 "${shared_backup_manifest}"
            record_shared_asset run-rag-system.sh '/opt/rag-system/shared/run-rag-system.sh'
            record_shared_asset run-rag-system.cjs '/opt/rag-system/shared/run-rag-system.cjs'
            record_shared_asset rag-system.ecosystem.config.cjs '/opt/rag-system/shared/rag-system.ecosystem.config.cjs'
            record_shared_asset manage-rag-system-pm2.sh '/opt/rag-system/shared/manage-rag-system-pm2.sh'
            shared_assets_armed=1
          }

          install_shared_asset() {
            source_name="$1"
            target="$2"
            mode="$3"
            validator="$4"
            stage="${target}.next.$$"
            tr -d '\r' < "${REMOTE_DIR}/${source_name}" > "${stage}"
            chmod "${mode}" "${stage}"
            case "${validator}" in
              bash) bash -n "${stage}" ;;
              # Staged files end in .next.<pid>, so passing the path makes
              # Node reject the temporary extension before it can parse CJS.
              node) node --check < "${stage}" ;;
              *) echo "Unknown shared asset validator: ${validator}" >&2; return 2 ;;
            esac
            if [ -f "${target}" ] && cmp -s "${stage}" "${target}"; then
              rm -f "${stage}"
              return 0
            fi
            if [ -f "${target}" ]; then
              cp -a "${target}" "${target}.bak.$(date +%Y%m%d%H%M%S)"
            fi
            mv -f "${stage}" "${target}"
          }

          lock_file='/run/lock/rag-system-env-reload.lock'
          if [ -e "${lock_file}" ] || [ -L "${lock_file}" ]; then
            test -f "${lock_file}"
            test ! -L "${lock_file}"
            test "$(stat -c '%U:%G' -- "${lock_file}")" = 'root:root'
          fi
          umask 077
          exec 9>"${lock_file}"
          chmod 600 "${lock_file}"
          flock -x 9

          prepare_shared_directory
          prepare_shared_asset_backup
          install_shared_asset run-rag-system.sh '/opt/rag-system/shared/run-rag-system.sh' 700 bash
          install_shared_asset run-rag-system.cjs '/opt/rag-system/shared/run-rag-system.cjs' 700 node
          install_shared_asset rag-system.ecosystem.config.cjs '/opt/rag-system/shared/rag-system.ecosystem.config.cjs' 600 node
          install_shared_asset manage-rag-system-pm2.sh '/opt/rag-system/shared/manage-rag-system-pm2.sh' 700 bash

          for script in release-host.sh post-release-gate.sh provision-postgres-host.sh patch-nginx.py apply-nginx.sh reload-rag-system-env.sh refresh-rag-nginx-token.sh; do
            tr -d '\r' < "${REMOTE_DIR}/${script}" > "${REMOTE_DIR}/${script}.normalized"
            mv -f "${REMOTE_DIR}/${script}.normalized" "${REMOTE_DIR}/${script}"
          done
          chmod 700 "${REMOTE_DIR}/release-host.sh" "${REMOTE_DIR}/post-release-gate.sh" "${REMOTE_DIR}/provision-postgres-host.sh" "${REMOTE_DIR}/apply-nginx.sh" "${REMOTE_DIR}/reload-rag-system-env.sh" "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          bash -n "${REMOTE_DIR}/release-host.sh"
          bash -n "${REMOTE_DIR}/post-release-gate.sh"
          bash -n "${REMOTE_DIR}/provision-postgres-host.sh"
          bash -n "${REMOTE_DIR}/apply-nginx.sh"
          bash -n "${REMOTE_DIR}/reload-rag-system-env.sh"
          bash -n "${REMOTE_DIR}/refresh-rag-nginx-token.sh"
          python3 -m py_compile "${REMOTE_DIR}/patch-nginx.py"
          test ! -e "${release_receipt}"
          test ! -L "${release_receipt}"

          RAG_POST_RELEASE_GATE="${REMOTE_DIR}/post-release-gate.sh" \
          RAG_SHARED_ASSET_BACKUP_DIR="${shared_backup_dir}" \
          RAG_SHARED_ASSET_BACKUP_MANIFEST="${shared_backup_manifest}" \
          RAG_RELEASE_GATE_ROOT="${REMOTE_DIR}" \
          RAG_RELEASE_RECEIPT_ROOT="${REMOTE_DIR}" \
          RAG_RELEASE_RECEIPT="${release_receipt}" \
          RAG_ENV_RELOAD_LOCK_HELD=1 \
          RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
          RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
          RAG_POSTGRES_CUTOVER_ACTION=activate \
          RAG_POSTGRES_PROVISIONER="${REMOTE_DIR}/provision-postgres-host.sh" \
          RAG_ENV_DEFAULTS_RENDERER="${REMOTE_DIR}/render-host-env-defaults.py" \
          RAG_ENV_DEFAULTS_EXAMPLE="${REMOTE_DIR}/.env.container.example" \
          "${REMOTE_DIR}/release-host.sh" \
            "${REMOTE_ARCHIVE}" \
            "${RELEASE_NAME}"
          shared_assets_armed=0
          REMOTE_SCRIPT

      - name: Verify released PostgreSQL public contract
        run: |
          set -euo pipefail
          readonly postgres_public_port='25432'
          probe_dir="$(mktemp -d "${RUNNER_TEMP}/rag-postgres-public-full.XXXXXXXXXX")"
          chmod 700 -- "${probe_dir}"
          postgres_ca="${probe_dir}/ca.crt"
          public_client_env="${probe_dir}/rag-app-client.env"

          cleanup_released_public_postgres_probe() {
            status=$?
            trap - EXIT
            set +e
            unset PGPASSWORD PGHOST PGPORT PGDATABASE PGUSER PGSSLMODE PGSSLROOTCERT
            unset POSTGRES_PUBLIC_EXPECTED_HOST POSTGRES_PUBLIC_VERIFY_PHASE
            rm -f -- "${postgres_ca}" "${public_client_env}" || status=1
            rmdir -- "${probe_dir}" || status=1
            exit "${status}"
          }
          trap cleanup_released_public_postgres_probe EXIT

          scp -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rag-system/shared/.postgres-host/tls/ca.crt" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rag-system/shared/.postgres-host/tls/rag-app-client.env" \
            "${probe_dir}/"
          chmod 600 -- "${postgres_ca}" "${public_client_env}"
          for protected_file in "${postgres_ca}" "${public_client_env}"; do
            test -s "${protected_file}"
            test ! -L "${protected_file}"
            test "$(stat -c '%a' -- "${protected_file}")" = '600'
          done
          if [ "$(wc -l < "${public_client_env}")" -ne 7 ] \
            || grep -Eqv "^(PGHOST|PGPORT|PGDATABASE|PGUSER|PGPASSWORD|PGSSLMODE|PGSSLROOTCERT)='[A-Za-z0-9._:/-]+'$" "${public_client_env}"; then
            echo '::error::PostgreSQL public client environment has an unsafe contract'
            exit 1
          fi
          for client_key in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD PGSSLMODE PGSSLROOTCERT; do
            if [ "$(grep -c "^${client_key}=" "${public_client_env}")" -ne 1 ]; then
              echo '::error::PostgreSQL public client environment has duplicate or missing keys'
              exit 1
            fi
          done
          set -a
          # This root-owned file was syntax-constrained above before sourcing.
          . "${public_client_env}"
          set +a
          export PGSSLMODE='verify-full'
          PGSSLROOTCERT="$(readlink -f -- "${postgres_ca}")"
          export PGSSLROOTCERT
          POSTGRES_PUBLIC_EXPECTED_HOST="${DEPLOY_HOST}"
          export POSTGRES_PUBLIC_EXPECTED_HOST
          POSTGRES_PUBLIC_VERIFY_PHASE='full'
          export POSTGRES_PUBLIC_VERIFY_PHASE

          if ! timeout 30 node scripts/verify-postgres-public.mjs; then
            echo "::error::Application release completed, but PostgreSQL post-migration public full verification failed on TCP/${postgres_public_port}; the committed release was not automatically rolled back"
            exit 1
          fi
          unset PGPASSWORD
          echo "Released PostgreSQL public TLS/auth/permission contract verified on TCP/${postgres_public_port}"

      - name: Verify public deployment
        run: |
          set -euo pipefail
          live_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/rag-api/health/live")"
          echo "public liveness -> ${live_code}"
          test "${live_code}" = '200'
          portal_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/")"
          echo "public gateway -> ${portal_code}"
          test "${portal_code}" = '200'
          ui_code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}${BASE_PATH}")"
          echo "public anonymous RAG UI -> ${ui_code}"
          test "${ui_code}" = '302'

      - name: Roll back unfinished public PostgreSQL cutover
        if: ${{ failure() || cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f ~/.ssh/rag_system_deploy_key ]; then
            exit 0
          fi
          ssh -i ~/.ssh/rag_system_deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PARENT='${REMOTE_PARENT}' REMOTE_DIR='${REMOTE_DIR}' RELEASE_NAME='${RELEASE_NAME}' RAG_POSTGRES_PUBLIC_HOST='${DEPLOY_HOST}' RAG_POSTGRES_CUTOVER_TOKEN='${RELEASE_NAME}' bash -s" <<'REMOTE_POSTGRES_ROLLBACK'
          set -euo pipefail
          if [ ! -e "${REMOTE_DIR}" ] && [ ! -L "${REMOTE_DIR}" ]; then
            exit 0
          fi
          case "${REMOTE_DIR}" in
            "${REMOTE_PARENT}"/rag-system.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) exit 2 ;;
          esac
          test -d "${REMOTE_DIR}"
          test ! -L "${REMOTE_DIR}"
          test "$(readlink -f -- "${REMOTE_DIR}")" = "${REMOTE_DIR}"
          test "$(stat -c '%U:%G' -- "${REMOTE_DIR}")" = 'root:root'
          test "$(stat -c '%a' -- "${REMOTE_DIR}")" = '700'
          lock_file='/run/lock/rag-system-env-reload.lock'
          if [ -e "${lock_file}" ] || [ -L "${lock_file}" ]; then
            test -f "${lock_file}"
            test ! -L "${lock_file}"
            test "$(stat -c '%U:%G' -- "${lock_file}")" = 'root:root'
          fi
          umask 077
          exec 9>"${lock_file}"
          chmod 600 -- "${lock_file}"
          if ! flock -w 120 -x 9; then
            echo '::error::Timed out waiting for the release transaction lock; preserving all PostgreSQL and app state'
            exit 1
          fi
          release_receipt="${REMOTE_DIR}/release-state.receipt"
          shared_backup_dir="${REMOTE_DIR}/shared-assets"
          shared_backup_manifest="${REMOTE_DIR}/shared-assets.manifest"
          app_release_state=''
          release_started=0
          if [ -e "${release_receipt}" ] || [ -L "${release_receipt}" ] \
            || [ -e "${shared_backup_dir}" ] || [ -L "${shared_backup_dir}" ] \
            || [ -e "${shared_backup_manifest}" ] || [ -L "${shared_backup_manifest}" ]; then
            release_started=1
          fi

          validate_finalizer_release_receipt() {
            test "${release_receipt}" = "${REMOTE_DIR}/release-state.receipt" || return 2
            test -f "${release_receipt}" || return 2
            test ! -L "${release_receipt}" || return 2
            test "$(readlink -f -- "${release_receipt}")" = "${release_receipt}" || return 2
            test "$(stat -c '%U:%G' -- "${release_receipt}")" = 'root:root' || return 2
            test "$(stat -c '%a' -- "${release_receipt}")" = '600' || return 2
            test "$(wc -l < "${release_receipt}" | tr -d '[:space:]')" = '3' || return 2
            test "$(grep -c '^release=' "${release_receipt}")" = '1' || return 2
            test "$(grep -c '^token=' "${release_receipt}")" = '1' || return 2
            test "$(grep -c '^state=' "${release_receipt}")" = '1' || return 2
            receipt_release="$(awk -F= '$1 == "release" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            receipt_token="$(awk -F= '$1 == "token" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            receipt_state="$(awk -F= '$1 == "state" { print substr($0, index($0, "=") + 1) }' "${release_receipt}")"
            test "${receipt_release}" = "${RELEASE_NAME}" || return 2
            test "${receipt_token}" = "${RAG_POSTGRES_CUTOVER_TOKEN}" || return 2
            case "${receipt_state}" in
              app-committed|app-rolled-back) ;;
              *) return 2 ;;
            esac
            app_release_state="${receipt_state}"
          }

          if [ "${release_started}" = '1' ] && ! validate_finalizer_release_receipt; then
            echo '::error::Release staging has no valid durable app receipt; preserving PostgreSQL, app/current, shared assets, and staging for manual reconciliation'
            exit 1
          fi
          provisioner="${REMOTE_DIR}/provision-postgres-host.sh"
          test -f "${provisioner}"
          test ! -L "${provisioner}"
          test -x "${provisioner}"
          test "$(stat -c '%U:%G' -- "${provisioner}")" = 'root:root'
          test "$(stat -c '%a' -- "${provisioner}")" = '700'
          if [ "${app_release_state}" = 'app-committed' ]; then
            RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
            RAG_POSTGRES_CUTOVER_ACTION=verify \
              "${provisioner}" \
              '/opt/rag-system/shared/.env.prod' \
              '/opt/rag-system/shared/.postgres-migration.env'
            echo 'Committed app/PostgreSQL receipts verified; protected staging was retained for audit'
            exit 0
          fi
          RAG_POSTGRES_PUBLIC_HOST="${RAG_POSTGRES_PUBLIC_HOST}" \
          RAG_POSTGRES_CUTOVER_TOKEN="${RAG_POSTGRES_CUTOVER_TOKEN}" \
          RAG_POSTGRES_CUTOVER_ACTION=rollback \
            "${provisioner}" \
            '/opt/rag-system/shared/.env.prod' \
            '/opt/rag-system/shared/.postgres-migration.env'
          echo "Pending PostgreSQL cutover rollback finalized; protected staging was retained for audit"
          REMOTE_POSTGRES_ROLLBACK
